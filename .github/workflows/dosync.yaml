name: Sync Docker Desktop Binaries

# 共享同步逻辑位于公共(Public)仓库 abldgsync/actions/sync(单一组合 action,通过 with.tool 选择工具)
#(当前引用 @main,建议钉成具体 commit SHA 以获得可复现构建)
on:
  # schedule:
  #   - cron: '0 3 * * *'  # 每天凌晨3点自动执行(使用最新版本,已屏蔽)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 同步 Docker Desktop 安装包
        uses: abldgsync/actions/sync@main
        with:
          tool: docker_desktop
