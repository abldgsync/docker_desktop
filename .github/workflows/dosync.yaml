name: Docker-Destkop-Installer

# 共享同步逻辑位于私有仓库 shared_actions/sync_docker_desktop.yaml(组合 action)
# 请将下方 OWNER 替换为你的 GitHub 组织/用户名
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 同步 Docker Desktop 安装包
        uses: abldgsync/shared_actions/sync_docker_desktop.yaml@v1
