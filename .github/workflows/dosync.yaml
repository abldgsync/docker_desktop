name: Docker-Destkop-Installer

# 共享同步逻辑位于私有仓库 shared_actions/sync_docker_desktop.yaml(组合 action,已钉 commit SHA 对应 v1)
on:
  # schedule:
  #   - cron: '0 3 * * *'  # 每天凌晨3点自动执行(使用最新版本,已屏蔽)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 同步 Docker Desktop 安装包
        uses: abldgsync/shared_actions/sync_docker_desktop.yaml@1bd39c681fe95f4ad9c07c7bf3f54d0d3cd94680  # 必须写死:uses 不支持 ENV/表达式,仓库名+路径+SHA 均需硬编码
