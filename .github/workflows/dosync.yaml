name: Docker-Destkop-Installer

# 共享同步逻辑位于私有仓库 shared_actions/sync_docker_desktop.yaml(组合 action,已钉 commit SHA 对应 v1)
on:
  # schedule:
  #   - cron: '0 3 * * *'  # 每天凌晨3点自动执行(使用最新版本,已屏蔽)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出私有共享动作
        uses: actions/checkout@v7
        with:
          repository: abldgsync/shared_actions
          ref: 1bd39c681fe95f4ad9c07c7bf3f54d0d3cd94680
          token: ${{ secrets.SYNC_PAT }}   # 需有读取 shared_actions 权限的 PAT(建议设为组织级 Secret)
          path: shared_actions
      - name: 同步 Docker Desktop 安装包
        uses: ./shared_actions/sync_docker_desktop.yaml  # 本地路径:从私有库检出后引用,仓库保持私有
